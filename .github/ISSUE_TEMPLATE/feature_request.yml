name: Feature request
description: Suggest an idea or a missing view
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The debugging / exploitation task this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it in the GUI. If pwndbg already has a command for it, name it.
    validations:
      required: true
