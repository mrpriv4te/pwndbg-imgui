name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyflakes
      - name: Lint
        run: python -m pyflakes $(find src/pwndbg_imgui tools tests -name '*.py')
      # the tested modules are stdlib-only: no imgui-bundle or display needed
      - name: Unit tests
        run: python -m pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package (as pipx would)
        run: pip install .
      - name: Smoke-test the entry point
        run: |
          pwndbg-imgui --version
          pwndbg-imgui --help > /dev/null
          pwndbg-imgui --exploit | grep -q "from pwn import"  # template shipped as package data
          test -f "$(pwndbg-imgui --agent-path)"
          python -c "import pwndbg_imgui.ui.app"  # the GUI imports with imgui-bundle installed

  # on a v* tag, once tests and packaging pass: publish a GitHub Release with the
  # commit list since the previous tag and the built wheel + sdist attached
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tools/release-notes.sh "$TAG" > notes.md
          flags=""
          case "${TAG#v}" in *[a-z]*) flags="--prerelease" ;; esac  # e.g. v1.4.0rc1
          gh release create "$TAG" dist/* --verify-tag --title "pwndbg-imgui ${TAG#v}" \
            --notes-file notes.md $flags
