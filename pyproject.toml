[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pwndbg-imgui"
dynamic = ["version"]
description = "A dockable Dear ImGui front-end for pwndbg"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "mrpriv4te" }]
dependencies = ["imgui-bundle>=1.92"]
keywords = ["pwndbg", "gdb", "debugger", "imgui", "reverse-engineering", "exploitation"]
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mrpriv4te/pwndbg-imgui"
Issues = "https://github.com/mrpriv4te/pwndbg-imgui/issues"
Changelog = "https://github.com/mrpriv4te/pwndbg-imgui/releases"

[project.scripts]
pwndbg-imgui = "pwndbg_imgui.cli:main"

# Version is derived from git tags (e.g. `git tag v1.3.0`) by hatch-vcs.
[tool.hatch.version]
source = "vcs"

# Write the resolved version into the package so it is available at runtime.
[tool.hatch.build.hooks.vcs]
version-file = "src/pwndbg_imgui/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pwndbg_imgui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# the sdist only needs what builds and tests the package (not the example's libc or screenshots)
[tool.hatch.build.targets.sdist]
exclude = ["examples", "docs", ".github"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, bugbear, pyupgrade, small clean-ups.
# Not the pylint refactor rules: ImGui draw code is long by nature.
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "PIE", "C4"]

# Type-checks everything but the files below. The App mixins (app, appearance, chrome,
# panels, sections) share state through `self` in a way a checker can't follow; move code
# out of them into standalone classes like ui/panes.py instead. views/widgets/native still
# have Optional-narrowing errors to fix before they can come off this list.
[tool.pyright]
include = ["src/pwndbg_imgui", "tests"]
exclude = [
    "src/pwndbg_imgui/ui/app.py", "src/pwndbg_imgui/ui/appearance.py", "src/pwndbg_imgui/ui/chrome.py",
    "src/pwndbg_imgui/ui/panels.py", "src/pwndbg_imgui/ui/sections.py",
    "src/pwndbg_imgui/ui/views.py", "src/pwndbg_imgui/ui/widgets.py", "src/pwndbg_imgui/ui/native.py",
    "**/__pycache__",
]
pythonVersion = "3.10"
